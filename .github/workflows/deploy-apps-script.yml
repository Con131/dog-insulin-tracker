name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - Code.gs
      - appsscript.json
      - .claspignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: apps-script-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Push and redeploy Apps Script
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          : "${CLASP_CREDENTIALS:?Add CLASP_CREDENTIALS to the apps-script-production environment}"
          : "${CLASP_SCRIPT_ID:?Add CLASP_SCRIPT_ID to the apps-script-production environment}"
          : "${CLASP_DEPLOYMENT_ID:?Add CLASP_DEPLOYMENT_ID to the apps-script-production environment}"
          [[ "$CLASP_SCRIPT_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$CLASP_DEPLOYMENT_ID" =~ ^[A-Za-z0-9_-]+$ ]]

          umask 077
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$CLASP_SCRIPT_ID" > .clasp.json

          clasp push --force
          clasp create-deployment \
            --deploymentId "$CLASP_DEPLOYMENT_ID" \
            --description "GitHub Actions ${GITHUB_SHA::7}"
